name: dotfiles
root: ~/dotfiles

<% if ENV['MUX_LAYOUT'] == 'wide' %>
windows:
  - Workspace:
      layout: tiled
      panes:
        - nvim
        -
        - claude
<% else %>
windows:
  - Workspace:
      layout: main-vertical
      panes:
        - nvim
        -
  - Claude:
      panes:
        - claude
<% end %>
