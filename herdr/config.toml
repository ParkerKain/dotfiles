# herdr config. Symlinked to ~/.config/herdr/config.toml.
# Reload a running server with `herdr server reload-config` (or prefix+shift+r).
# Full reference: `herdr --default-config`.

onboarding = false

[theme]
name = "rose-pine"

# Rose Pine Moon. herdr only ships main and dawn, so override main's tokens
# with the moon palette (https://rosepinetheme.com/palette).
# "Rose Glow": sidebar and tab strip sit darker than the terminal background
# (#232136) so they separate from the panes; unselected tabs get a raised
# chip and the active tab is rose.
[theme.custom]
sidebar_bg = "#1f1d2e"     # unset = terminal bg, which blends with panes
panel_bg = "#191724"       # tab bar strip
surface0 = "#393552"       # unselected tab chips (overlay)
surface1 = "#44415a"       # highlight med
surface_dim = "#2a273f"    # divider lines (surface)
active_row_bg = "#44415a"  # current workspace/agent row (highlight med; brighter looks blocky in the collapsed rail)
selection_bg = "#56526e"   # highlight high
overlay0 = "#908caa"       # subtle; unselected tab text
overlay1 = "#908caa"       # subtle
text = "#e0def4"
accent = "#ea9a97"        # rose; active tab
mauve = "#c4a7e7"         # iris; branch names
green = "#3e8fb0"         # pine
blue = "#3e8fb0"          # pine
teal = "#9ccfd8"          # foam
yellow = "#f6c177"        # gold
red = "#eb6f92"           # love
peach = "#ea9a97"         # rose

[ui]
status_indicators = "symbols"
# Blocked and done agents float to the top of the sidebar.
agent_panel_sort = "priority"
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%I:%M" },
]
window_title = "{workspace}: {tab}"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true
# Absolute path: relative ones resolve from ~/.config/herdr (the symlink), not dotfiles.
path = "/Users/parker/dotfiles/herdr/sounds/blow.mp3"  # macOS Blow.aiff as mp3

[keys]
# Hop between agents in the sidebar's (priority) order, across workspaces.
# Alt is Aerospace's, so direct jumps use Ctrl; ctrl+1 is the agent that most needs me.
next_agent = "prefix+]"
previous_agent = "prefix+["
focus_agent = "ctrl+1..9"

# prefix+a: pick an agent (c Claude, x Codex, p Pi) for a new tab in this
# workspace and folder.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "$HOME/dotfiles/herdr/bin/agent-picker"
description = "new agent tab"
width = 34
height = 11

# prefix+shift+s: new Claude tab in the persistent 'scratch' workspace.
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "HERDR_ENV=1 $HOME/dotfiles/herdr/bin/herdr-scratch \"$HERDR_ACTIVE_PANE_CWD\""
description = "scratch Claude"

# prefix+t: start a Toggl timer for this tab's task, or stop the running one.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "$HOME/dotfiles/herdr/bin/ops-timer"
description = "ops timer"
width = 60
height = 12

# Ctrl+Arrow: move between nvim splits and herdr panes (bin/nav, plus the
# nvim side in .config/nvim/lua/plugins/navigator.lua).
[[keys.command]]
key = "ctrl+left"
type = "shell"
command = "$HOME/dotfiles/herdr/bin/nav left"
description = "pane or nvim split left"

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = "$HOME/dotfiles/herdr/bin/nav down"
description = "pane or nvim split down"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = "$HOME/dotfiles/herdr/bin/nav up"
description = "pane or nvim split up"

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = "$HOME/dotfiles/herdr/bin/nav right"
description = "pane or nvim split right"
