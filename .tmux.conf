# List of plugins
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
setw -g mode-keys vi
# --- Claude workflow foundations ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off
set -g focus-events on
set -g history-limit 50000

# Seamless pane navigation with nvim (vim-tmux-navigator), Ctrl+Arrow keys
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-Left  if-shell "$is_vim" "send-keys C-Left"  "select-pane -L"
bind-key -n C-Down  if-shell "$is_vim" "send-keys C-Down"  "select-pane -D"
bind-key -n C-Up    if-shell "$is_vim" "send-keys C-Up"    "select-pane -U"
bind-key -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"
# Clear minimap state on server start: pane ids restart from %0 on a fresh
# server, so files orphaned by a crash must not match new panes.
run-shell 'rm -f ~/.claude/tmux-state/* 2>/dev/null || true'

# Global Claude minimap
bind-key g display-popup -E -w 80% -h 60% "$HOME/.tmux/scripts/claude-map"

# Claude status ticker: prefix+G toggles a second status-bar line with one
# colored chip per live Claude pane (same data as prefix+g), left-aligned.
# Non-modal - panes stay live and keep focus the whole time.
set -g status-format[1] '#[align=left]#(~/.tmux/scripts/claude-map-statusline #{client_width} #{pane_id})'
bind-key G if-shell -F '#{==:#{status},2}' 'set -g status on' 'set -g status 2'

# Toggl timer. The window carries its task (@ops-task-ref, stamped by the
# ops-tasks TUI when it opens a harness window), so prefix+t tags what you
# are working on with no picker. Nothing starts on its own except meetings.
# Replaces the default clock-mode binding on prefix+t.
# The popup holds open on failure so a window with no task stamp says why
# instead of blinking shut.
bind-key t   display-popup -E -w 60 -h 12 'ops-tasks track start --window || { echo; echo "[enter to close]"; read x; }'
bind-key T   run-shell 'ops-tasks track stop'

# Claude / pi launchers
bind-key C run-shell "$HOME/.tmux/scripts/claude-window '#S' '#{pane_current_path}'"
bind-key S run-shell "$HOME/.tmux/scripts/claude-scratch --switch '#{pane_current_path}'"
bind-key P run-shell "$HOME/.tmux/scripts/pi-window '#S' '#{pane_current_path}'"
bind-key X run-shell "$HOME/.tmux/scripts/codex-window '#S' '#{pane_current_path}'"

set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'moon' # Options are 'main', 'moon' or 'dawn'
set -g @rose_pine_host 'on' # Enables hostname in the status bar
set -g @rose_pine_date_time '%I:%M' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_user 'on' # Turn on the username component in the statusbar
set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar
set -g @rose_pine_status_right_append_section '#(~/.tmux/scripts/ops-timer-status)#(~/.tmux/scripts/claude-waiting-count)'
set -g default-terminal "screen-256color"  # Setting the correct term
