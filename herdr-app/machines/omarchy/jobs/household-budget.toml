# Refresh the existing owner-private household budget and review transaction comments.
repo = "~/dotfiles"
agent = "codex"
space = "Jobs"
tab = "Budget refresh run"
require_visible = true
approve_for_me = true
close_when_done = false
prompt = '''
Refresh the household budget for Sites project appgprj_6ad505ed87fc81919d3137f77c1b1090 and review its pending owner transaction comments. The verified live origin is https://kain-household-budget.parkerjkain.chatgpt.site. Keep all results and questions in this Herdr tab.

Access and current instructions

- Use native Sites get_site to verify this exact project, its canonical live origin, the authenticated owner role, and owner-only audience. Request the published MCP connection details to identify the Site-provisioned Household Budget plugin. Discover the actual native tools and their input schemas in this Codex session. Use only tools from that verified private plugin for budget data. Recheck owner-only identity, audience and connector binding before writes. An origin, owner or plugin mismatch blocks access pending review.
- Read get_update_guide and follow its current requirements through the native tools. Fetch only the guide's documented builder, parser and contracts with get_refresh_resource. Run the portable Python builder and parser together with the documented arguments. Keep working data private and ephemeral. Keep raw account identifiers and transaction evidence out of the visible report and user-facing snapshot payload.
- If Sites reports that the publication has no MCP connector, report that the owner-private publication for this project needs the approved MCP deployment. If the published plugin is identified but its tools are absent or authorization fails, report which tool or approval is missing and that Parker needs to install or connect that exact Site-provisioned plugin in native Codex and confirm the tools appear in a fresh visible tab. If a native approval appears, leave it for Parker in this tab. Report a separate Finance blocker if the connected Finance tools are unavailable. Use no shell HTTP, service credentials, browser, cached checkout or other fallback for Site access. Leave sharing and grants unchanged.

Finance and snapshot refresh

- Use connected Finance/Plaid as the ongoing source. Rocket Money exports serve only as verification and target reference. Read linked-account coverage. Query the full horizon from 2026-08-01 through the current Eastern date, including transfers and both posted and pending records. Use those same date bounds across pages and exhaust all cursors. Verify source dates, pending status, expected linked accounts and bank freshness separately from retrieval time. Require affirmative complete Finance coverage for the requested scope, reconcile counts, and require a nonempty result before snapshot publication. An exhausted cursor alone does not prove completeness.
- Read the current snapshot with get_budget_snapshot and its referenced immutable mapping with get_mapping_rules. Build with the documented inputs. Preserve source provenance, verified account-alias deduplication, Finance dates, signed refunds and reimbursement/exclusion handling. Count savings contributions once and exclude internal investment trades from savings. Keep pending amounts separate from posted actuals. Extend month coverage through the current month as needed and label provisional carried targets or incomplete source coverage. Never invent future actuals or replace a valid snapshot with partial, empty or failed retrieval.
- Preserve user payroll inputs, budgets, category choices, transaction recodes, descriptions, comments and baby selections in their separate shared stores. Read existing edits with get_transaction_overrides. For routine purchases, infer the best supported existing category from the merchant, description and available transaction context, even if source confidence is low. Use the supported mapping tools or apply_transaction_override, record provenance, distinguish assistant inference from owner confirmation and never overwrite explicit owner corrections. Limit overrides to categories and displayed descriptions, use the current identity, source hashes and expected prior values, and verify changed fields independently with get_transaction_overrides. Apply clear recurring owner guidance to matching future transactions when supported. A one-transaction correction stays scoped to that transaction unless evidence supports a broader rule. Do not claim purchase-item knowledge without evidence. For material uncertainty about income, transfers, savings, trades, reimbursements or exclusions, retain the last reliable handling and ask a concise necessary question. Never change bank records, source amounts, pending status or exclusions to force a category.
Prepublication metadata gate

- Use the full authoritative native connector results for the latest snapshot and its exact immutable mapping version. Verify identifiers, completeness and exact-rule counts where available. Reject truncated, summarized or reconstructed inputs. If the latest snapshot still shows blank labels or missing verification/audit context from the known regression, read the full archived snapshot 2026-11-22T114241000000Z by exact ID as the known-good comparison. Still compare the final hash with the actual latest snapshot.
- After building and before any mapping or snapshot publication, check every row's nonblank account label against the fresh Finance source account_id joined to the same linked-account inventory, using only documented sanitized names and approved canonical aliases. Restore a known prior label only when the row matches uniquely by the full stable source hash set and record count and fresh account evidence does not conflict. Block on ambiguous joins, conflicting evidence or a new row without a verified sanitized label. Never emit opaque account IDs.
- Derive dated row verification only from explicit exact rules in the immutable mapping version. Require the complete source hash set and count and stable eligibility evidence binding the rule to the current row, including merchant text when it affects the evidence. Never copy verification from a prior row or infer it for changed or new rows. Compare with trusted prior coverage by exact identity. Block unexplained verification loss, material aggregate loss or any unresolved conflict. Preserve missing dated top-level archival examples and explanations unchanged from the trusted comparison, including finance_only_sep_oct, month_boundary_matches and user_correction_note. Preserve existing group notes and keep new reliable evidence separate so historical evidence retains its original date and meaning. Block conflicting archival metadata rather than merging by guesswork.
- Assert that metadata handling changes only account labels, dated row verification and dated archival metadata. Compare against the unmodified builder output for amounts, totals, grouping, row identity and all other row data, including pending and inclusion flags. Verify the final labels, row verification and audit fields against their expected values. If any check is inconclusive, leave the existing archive and mapping untouched and report the blocker. Continue independent comment review under the existing rules.
- Recompute the existing semantic content hash after metadata handling and skip snapshot publication when material content is unchanged. When required, use publish_mapping_rules and independently verify the exact immutable version with get_mapping_rules before publishing a snapshot that references it. Use publish_budget_snapshot and independently read back the exact submitted ID with get_budget_snapshot. Verify the guide's readback fields and compare the exact native readback's labels, dated row verification and archival metadata with the validated candidate. Report publication as verified only when they match. On an uncertain write, read back the exact ID or fields and reconcile the observed state before considering a retry.

Transaction comments

- Review comments independently even if Finance retrieval, the builder or snapshot publication fails, as long as owner authentication and the current comment contract are available. Follow comment_review in the live guide and use get_transaction_comments for pending notes. Verify the transaction identity and source hashes and review the context. Apply and verify clear requested budget category or displayed-description corrections with the conditional override tools, preserving source records, exclusions and amounts.
- Leave ambiguous or unauthorized requests pending and ask only the necessary question in this tab. Comments authorize only bounded budget corrections. After actually handling a comment, record concrete handling notes and call resolve_transaction_comment for that exact comment using the guide's conditional, idempotent workflow. Independently read back both the exact comment resolution with get_transaction_comments and the changed data with get_transaction_overrides. Leave unhandled comments pending and verify the outcome of uncertain writes before considering a retry.

Visible result

Stay quiet on routine success and ordinary inferred categorization when there is no comment action or issue to report. Otherwise, briefly report handled comments, decisions needed, actionable connection or publication blockers, material reconciliation problems or newly unreliable data, with the verified budget link. Avoid repeating an unchanged blocker or completed action already reported in an earlier Budget refresh run tab when that result is available. Do not send ChatGPT messages, external communications or notifications. Leave the last good budget in place if a refresh fails.
'''

[schedule]
times = ["03:00", "12:00"]
